services:
  - type: web
    name: devpulse
    env: docker
    plan: free

    dockerfilePath: ./Dockerfile

    envVars:
      - key: NEON_DB_URL
        sync: false
      - key: NEON_DB_USERNAME
        sync: false
      - key: NEON_DB_PASSWORD
        sync: false
      - key: TOKEN
        sync: false
      - key: CHAT_ID
        sync: false